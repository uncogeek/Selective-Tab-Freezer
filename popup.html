<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Selective Tab Freezer</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">❄</div>
        <div>
          <h1>Selective Tab Freezer</h1>
          <p data-i18n="popupSubtitle"></p>
        </div>
      </header>

      <section class="current-card">
        <label data-i18n="currentTab"></label>
        <div id="current-url" class="current-url" data-i18n="loading"></div>
        <label for="comment" data-i18n="optionalComment"></label>
        <input id="comment" type="text" data-i18n-placeholder="optionalCommentPlaceholder">
        <button id="add-current" type="button" class="" data-i18n="addCurrent"></button>
      </section>

      <button id="freeze" type="button" class="freeze-button" data-i18n="freezeSaved"></button>
      <button id="settings" type="button" class="link-button" data-i18n="openSettings"></button>
      <output id="status" aria-live="polite"></output>
    </main>

    <script src="core.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
